---
name: FlightPoster
strategy: polling
polling_verb: get
polling_url: |-
  https://opendata.adsb.fi/api/v2/lat/{{ lat }}/lon/{{ lon }}/dist/{{ radius_km | times: 1.3 | ceil }}
  https://api.open-meteo.com/v1/forecast?latitude={{ lat }}&longitude={{ lon }}&current=weather_code,temperature_2m
polling_headers: ''
refresh_interval: 5
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
custom_fields:
- keyname: about
  field_type: author_bio
  name: FlightPoster
  description: "Shows the plane flying over your home, live, with the real weather in the sky. Data: adsb.fi, adsbdb, VRS standing data (adsb.lol) and Open-Meteo. / Affiche l'avion qui passe au-dessus de chez vous, avec la vraie météo. v1.2.0"
  github_url: https://github.com/BartoX360/FlightPoster
- keyname: lat
  field_type: string
  name: Latitude
  description: Latitude of your home (e.g. 48.8566)
  help_text: Right-click a spot on Google Maps to copy its coordinates.
- keyname: lon
  field_type: string
  name: Longitude
  description: Longitude of your home (e.g. 2.3522)
- keyname: city
  field_type: string
  name: Display name / Nom affiché
  description: Shown in "The sky above …". Leave empty for "home".
  optional: true
- keyname: language
  field_type: select
  name: Language / Langue
  options:
  - English: en
  - Français: fr
  default: en
- keyname: units
  field_type: select
  name: Units / Unités
  options:
  - Metric (m, km/h, °C): metric
  - Imperial (ft, mph, °F): imperial
  default: metric
- keyname: radius_km
  field_type: number
  name: Radius / Rayon
  description: How close a plane must be to count as "overhead" (km, or miles with imperial units).
  default: 25
- keyname: prefer_airliners
  field_type: select
  name: Prefer airliners / Avions de ligne en priorité
  description: Ignore light aircraft when an airliner is within the radius.
  options:
  - 'Yes': 'yes'
  - 'No': 'no'
  default: 'yes'
- keyname: style
  field_type: select
  name: Style
  description: E-ink for black & white screens (TRMNL), Color for LCD screens.
  options:
  - E-ink: eink
  - Color / Couleur: color
  default: eink
